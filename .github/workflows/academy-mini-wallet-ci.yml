name: Academy Mini Wallet CI

on:
  pull_request:
    paths:
      - 'backend/wallet/**'
      - 'backend/api/wallet.py'
      - 'backend/badges_engine.py'
      - 'backend/infra_indexes.py'
      - 'backend/tests/test_academy_wallet.py'
      - 'frontend/src/pages/Wallet.js'
      - '.github/workflows/academy-mini-wallet-ci.yml'
  push:
    branches:
      - 'fix/academy-mini-wallet-scope'
    paths:
      - 'backend/wallet/**'
      - 'backend/api/wallet.py'
      - 'backend/badges_engine.py'
      - 'backend/infra_indexes.py'
      - 'backend/tests/test_academy_wallet.py'
      - 'frontend/src/pages/Wallet.js'
      - '.github/workflows/academy-mini-wallet-ci.yml'

jobs:
  backend-wallet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile wallet modules
        run: python -m compileall wallet api/wallet.py badges_engine.py infra_indexes.py
      - name: Run Academy mini-wallet tests
        run: pytest -q tests/test_academy_wallet.py

  frontend-wallet-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Yarn 1
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build frontend
        run: yarn build
