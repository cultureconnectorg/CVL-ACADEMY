name: CI

# REL-01 / ACA-0031 — real repository regression gate.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8
        run: python -m flake8 .

      - name: pytest
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: cvln_academy_ci
          JWT_SECRET: ci-test-secret-not-a-real-secret
        run: python -m pytest tests/ -q --ignore=tests/backend_test.py

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (includes CRA's own ESLint pass)
        env:
          CI: "true"
        run: yarn build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite (production defaults / flags off)
        run: npx playwright test

      - name: Run spatial closure proof (flags on)
        env:
          REACT_APP_ACADEMY_SPATIAL_HUB_ENABLED: "true"
          REACT_APP_ACADEMY_SPATIAL_MODULE_DEPTH: "true"
          REACT_APP_ACADEMY_SPATIAL_ENVIRONMENT: "true"
        run: npx playwright test e2e/spatial-closure.spec.js
