name: Commercial Wallet CI

on:
  push:
    branches:
      - feat/academy-wallet-commercial-runtime-20260911
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: commercial-wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-runtime:
    name: Economy order Wallet entitlement runtime
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "isort>=5.13.2,<6"
      - name: Black commercial files
        working-directory: backend
        run: black --check --diff commercial.py api/commercial.py api/commercial_access.py services/cvln_wallet.py tests/test_commercial_wallet_policy.py tests/test_commercial_wallet_runtime.py
      - name: Isort commercial files
        working-directory: backend
        run: isort --profile black --check-only commercial.py api/commercial.py api/commercial_access.py services/cvln_wallet.py tests/test_commercial_wallet_policy.py tests/test_commercial_wallet_runtime.py
      - name: Flake8 commercial files
        working-directory: backend
        run: flake8 --config=.flake8 commercial.py api/commercial.py api/commercial_access.py services/cvln_wallet.py tests/test_commercial_wallet_policy.py tests/test_commercial_wallet_runtime.py
      - name: Mypy commercial runtime
        working-directory: backend
        run: mypy --ignore-missing-imports commercial.py api/commercial.py api/commercial_access.py services/cvln_wallet.py
      - name: Commercial policy and runtime tests
        working-directory: backend
        run: pytest -q tests/test_commercial_wallet_policy.py tests/test_commercial_wallet_runtime.py -n 0

  economy-regression:
    name: Economy 3D 812-line regression
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run 812 Economy source cases
        working-directory: backend
        run: pytest -q tests/test_economy_3d_traceability.py -n 0
      - name: Existing backend regression
        working-directory: backend
        run: pytest tests/ -n 0 --ignore=tests/backend_test.py
