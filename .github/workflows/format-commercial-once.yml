name: Format Commercial Once

on:
  push:
    branches:
      - reconcile/pr54-commercial-billing-current-main-20260912

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/pr54-commercial-billing-current-main-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'isort==5.13.2' 'black==26.5.1'
      - name: Apply repository import formatting
        run: |
          isort --profile black \
            backend/api/billing.py \
            backend/api/billing_views.py \
            backend/api/commercial.py \
            backend/api/commercial_access.py \
            backend/billing_einvoice.py \
            backend/server.py \
            backend/tests/test_billing_api.py \
            backend/tests/test_billing_core.py \
            backend/tests/test_billing_production_config.py \
            backend/tests/test_commercial_wallet_policy.py \
            backend/tests/test_commercial_wallet_runtime.py
          black \
            backend/api/billing.py \
            backend/api/billing_views.py \
            backend/api/commercial.py \
            backend/api/commercial_access.py \
            backend/billing_einvoice.py \
            backend/server.py \
            backend/tests/test_billing_api.py \
            backend/tests/test_billing_core.py \
            backend/tests/test_billing_production_config.py \
            backend/tests/test_commercial_wallet_policy.py \
            backend/tests/test_commercial_wallet_runtime.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'style: apply repository formatter output to commercial billing'
          git push origin HEAD:reconcile/pr54-commercial-billing-current-main-20260912
