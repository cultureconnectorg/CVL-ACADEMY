name: Format Workbook Runtime Once

on:
  push:
    branches:
      - reconcile/pr24-workbook-runtime-20260912

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/pr24-workbook-runtime-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatters
        run: pip install black==26.5.1 isort==5.13.2
      - name: Format reconciled backend files
        run: |
          black backend/api/workbook_runtime.py backend/services/catalogue_importer.py backend/services/workbook_runtime.py backend/tests/test_workbook_runtime_reconciliation.py backend/services/economy_workbook_runtime.py backend/services/cartography_2d_runtime.py backend/services/protocol_master_runtime.py backend/server.py backend/api/__init__.py
          isort --profile black --src-path backend backend/api/workbook_runtime.py backend/services/catalogue_importer.py backend/services/workbook_runtime.py backend/tests/test_workbook_runtime_reconciliation.py backend/services/economy_workbook_runtime.py backend/services/cartography_2d_runtime.py backend/services/protocol_master_runtime.py backend/server.py backend/api/__init__.py
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then
            git add backend
            git commit -m 'style: format workbook runtime reconciliation'
            git push origin HEAD:reconcile/pr24-workbook-runtime-20260912
          fi
