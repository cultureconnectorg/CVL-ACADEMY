name: Institutional Bridge CI

on:
  push:
    paths:
      - "backend/api/institutional.py"
      - "backend/api/__init__.py"
      - "backend/services/institutional_bridge/**"
      - "backend/tests/test_institutional_bridge.py"
      - "backend/infra_indexes.py"
      - "frontend/src/pages/admin/AdminDashboard.js"
      - "frontend/src/pages/admin/InstitutionalBridgePanel.js"
      - ".github/workflows/institutional-bridge-ci.yml"
  pull_request:
    paths:
      - "backend/api/institutional.py"
      - "backend/api/__init__.py"
      - "backend/services/institutional_bridge/**"
      - "backend/tests/test_institutional_bridge.py"
      - "backend/infra_indexes.py"
      - "frontend/src/pages/admin/AdminDashboard.js"
      - "frontend/src/pages/admin/InstitutionalBridgePanel.js"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: cvln_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: black --check api/institutional.py services/institutional_bridge tests/test_institutional_bridge.py
      - run: isort --profile black --check-only api/institutional.py services/institutional_bridge tests/test_institutional_bridge.py
      - run: flake8 api/institutional.py services/institutional_bridge tests/test_institutional_bridge.py
      - run: pytest tests/test_institutional_bridge.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
