name: MCP Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/mcp_server.py"
      - "backend/server.py"
      - "backend/tests/test_mcp_server.py"
      - ".github/workflows/mcp-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP client
        run: python -m pip install "mcp>=2.2,<3"
      - name: Verify Render MCP endpoint
        env:
          MCP_URL: https://cvl-academy.onrender.com/mcp
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys
          import time
          from mcp import Client

          url = os.environ["MCP_URL"]
          last_error = None

          async def probe():
              async with Client(url) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  required = {
                      "academy_capabilities",
                      "search_formations",
                      "get_formation",
                  }
                  missing = required - names
                  if missing:
                      raise RuntimeError(f"Missing MCP tools: {sorted(missing)}")

                  result = await client.call_tool("academy_capabilities", {})
                  if result.is_error:
                      raise RuntimeError("academy_capabilities returned an MCP error")

          for attempt in range(1, 13):
              try:
                  asyncio.run(probe())
                  print(f"Production MCP verified at {url}")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {exc}")
                  if attempt < 12:
                      time.sleep(30)

          raise SystemExit(f"Production MCP smoke test failed: {last_error}")
          PY
