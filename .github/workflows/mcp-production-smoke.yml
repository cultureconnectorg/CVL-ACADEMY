name: MCP Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/mcp_server.py"
      - "backend/server.py"
      - "backend/tests/test_mcp_server.py"
      - ".github/workflows/mcp-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP client
        run: python -m pip install "mcp>=2.2,<3"
      - name: Verify Render health, MCP contract and Mongo-backed reads
        env:
          APP_URL: https://cvl-academy.onrender.com
          MCP_URL: https://cvl-academy.onrender.com/mcp
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from mcp import Client

          app_url = os.environ["APP_URL"].rstrip("/")
          mcp_url = os.environ["MCP_URL"]
          last_error = None

          def describe_exception(exc, depth=0):
              indent = "  " * depth
              lines = [f"{indent}{type(exc).__name__}: {exc}"]
              children = getattr(exc, "exceptions", None) or []
              for child in children:
                  lines.extend(describe_exception(child, depth + 1))
              cause = getattr(exc, "__cause__", None)
              if cause is not None:
                  lines.append(f"{indent}caused by:")
                  lines.extend(describe_exception(cause, depth + 1))
              return lines

          def get_json(path):
              url = f"{app_url}{path}"
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "cvln-academy-runtime-proof/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      payload = json.loads(body)
                      print(
                          f"HTTP proof {path}: status={response.status} "
                          f"payload={json.dumps(payload, sort_keys=True)}"
                      )
                      return response.status, payload
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP proof {path} returned {exc.code}: {body[:1000]}"
                  ) from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(
                      f"HTTP proof {path} connection failure: {exc.reason}"
                  ) from exc

          async def call_ok(client, name, arguments):
              print(f"MCP stage: call_tool {name}")
              result = await client.call_tool(name, arguments)
              if result.is_error:
                  raise RuntimeError(
                      f"{name} returned an MCP error: {result.content}"
                  )
              return result.structured_content or {}

          async def probe_mcp():
              print(f"MCP stage: connect {mcp_url}")
              async with Client(mcp_url) as client:
                  print("MCP stage: list_tools")
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  required = {
                      "academy_capabilities",
                      "list_poles",
                      "search_formations",
                      "get_formation",
                  }
                  missing = required - names
                  if missing:
                      raise RuntimeError(
                          f"Missing MCP tools: {sorted(missing)}; available={sorted(names)}"
                      )

                  await call_ok(client, "academy_capabilities", {})
                  await call_ok(client, "list_poles", {"limit": 5})
                  catalogue = await call_ok(
                      client, "search_formations", {"limit": 5}
                  )

                  items = catalogue.get("items") or []
                  if items:
                      code = items[0].get("code")
                      if not code:
                          raise RuntimeError(
                              "First published formation has no code"
                          )
                      detail = await call_ok(
                          client, "get_formation", {"code": code}
                      )
                      if detail.get("found") is not True:
                          raise RuntimeError(
                              f"Published formation {code} was not readable "
                              "by get_formation"
                          )
                      print(
                          f"Mongo-backed formation detail verified for {code}"
                      )
                  else:
                      print(
                          "Catalogue is reachable but currently returned zero "
                          "published formations"
                      )

          for attempt in range(1, 13):
              try:
                  print(f"Production proof attempt {attempt}/12")
                  live_status, live = get_json("/api/health/live")
                  if live_status != 200 or live.get("status") != "alive":
                      raise RuntimeError(f"Liveness contract failed: {live}")

                  ready_status, ready = get_json("/api/health/ready")
                  if ready_status != 200 or ready.get("status") != "ready":
                      raise RuntimeError(f"Readiness contract failed: {ready}")

                  asyncio.run(probe_mcp())
                  print(
                      "Production HTTP readiness, MCP contract and Mongo-backed "
                      f"reads verified at {app_url}"
                  )
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed with exception tree:")
                  for line in describe_exception(exc):
                      print(line)
                  if attempt < 12:
                      time.sleep(30)

          details = "\n".join(describe_exception(last_error))
          raise SystemExit(
              "Production MCP smoke test failed after 12 attempts:\n" + details
          )
          PY
