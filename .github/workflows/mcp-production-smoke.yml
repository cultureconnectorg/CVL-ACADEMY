name: MCP Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/mcp_server.py"
      - "backend/server.py"
      - "backend/tests/test_mcp_server.py"
      - ".github/workflows/mcp-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP client
        run: python -m pip install "mcp>=2.2,<3"
      - name: Verify Render MCP endpoint and production reads
        env:
          MCP_URL: https://cvl-academy.onrender.com/mcp
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys
          import time
          from mcp import Client

          url = os.environ["MCP_URL"]
          last_error = None

          async def call_ok(client, name, arguments):
              result = await client.call_tool(name, arguments)
              if result.is_error:
                  raise RuntimeError(f"{name} returned an MCP error: {result.content}")
              return result.structured_content or {}

          async def probe():
              async with Client(url) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  required = {
                      "academy_capabilities",
                      "list_poles",
                      "search_formations",
                      "get_formation",
                  }
                  missing = required - names
                  if missing:
                      raise RuntimeError(f"Missing MCP tools: {sorted(missing)}")

                  await call_ok(client, "academy_capabilities", {})
                  await call_ok(client, "list_poles", {"limit": 5})
                  catalogue = await call_ok(client, "search_formations", {"limit": 5})

                  items = catalogue.get("items") or []
                  if items:
                      code = items[0].get("code")
                      if not code:
                          raise RuntimeError("First published formation has no code")
                      detail = await call_ok(client, "get_formation", {"code": code})
                      if detail.get("found") is not True:
                          raise RuntimeError(f"Published formation {code} was not readable by get_formation")
                      print(f"Mongo-backed formation detail verified for {code}")
                  else:
                      print("Catalogue is reachable but currently returned zero published formations")

          for attempt in range(1, 13):
              try:
                  asyncio.run(probe())
                  print(f"Production MCP and Mongo-backed reads verified at {url}")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {exc}")
                  if attempt < 12:
                      time.sleep(30)

          raise SystemExit(f"Production MCP smoke test failed: {last_error}")
          PY
