name: CVLN Academy Platform CI

on:
  push:
    branches:
      - main
      - gstack/final-wiring-2026-09-11
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend delta quality and full tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
      CORS_ORIGINS: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "isort>=5.13.2,<6"
      - name: Resolve changed backend Python files
        id: changed
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            base="HEAD^"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          mapfile -t files < <(git diff --name-only "$base" HEAD -- 'backend/**/*.py' 'backend/*.py')
          printf '%s\n' "${files[@]}" > /tmp/backend-python-files.txt
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Black changed files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs black --check < /tmp/backend-python-files.txt
      - name: Isort changed files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs isort --check-only --profile black --src-path backend < /tmp/backend-python-files.txt
      - name: Flake8 changed files
        if: steps.changed.outputs.has_files == 'true'
        run: xargs flake8 --config=backend/.flake8 < /tmp/backend-python-files.txt
      - name: Pytest full backend suite
        working-directory: backend
        run: pytest tests/ -n 0 --ignore=tests/backend_test.py

  frontend:
    name: Frontend lint unit build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: ESLint
        run: npx eslint src e2e playwright.config.js
      - name: Unit tests
        run: CI=true yarn test --watchAll=false
      - name: Production build
        run: CI=true yarn build

  integration-smoke:
    name: Browser to API to Mongo
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_integration_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
      CORS_ORIGINS: http://127.0.0.1:4173
      E2E_BACKEND_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 4174 > /tmp/cvln-backend.log 2>&1 &
          echo $! > /tmp/cvln-backend.pid
      - name: Wait for readiness
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/api/health/ready >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cvln-backend.log || true
          exit 1
      - name: Install frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real integration smoke
        working-directory: frontend
        run: CI=true npx playwright test e2e/platform-integration.spec.js
      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/cvln-backend.log || true
