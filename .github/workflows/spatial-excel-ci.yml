name: Spatial Excel Line-by-Line CI

on:
  push:
    branches:
      - main
      - audit/spatial-excel-line-by-line-2026-09-11
  pull_request:

permissions:
  contents: read

concurrency:
  group: spatial-excel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: 137 Excel requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run one traceability test per requirement line
        run: node --test scripts/spatial-requirements.test.mjs

  frontend-unit-build:
    name: Frontend lint unit build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: ESLint
        run: npx eslint src e2e playwright.config.js
      - name: Unit tests
        run: CI=true yarn test --watchAll=false
      - name: Production build
        run: CI=true yarn build

  frontend-e2e:
    name: Frontend Playwright runtime
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_spatial_e2e_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
      CORS_ORIGINS: http://127.0.0.1:4173
      E2E_BACKEND_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Start backend
        working-directory: backend
        run: nohup uvicorn server:app --host 127.0.0.1 --port 4174 > /tmp/cvln-spatial-backend.log 2>&1 &
      - name: Wait for backend readiness
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4174/api/health/ready >/tmp/spatial-readiness.json; then
              cat /tmp/spatial-readiness.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cvln-spatial-backend.log || true
          exit 1
      - name: Install frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Runtime E2E
        working-directory: frontend
        run: CI=true npx playwright test
      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/cvln-spatial-backend.log || true

  backend-regression:
    name: Backend lint types tests
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: cvln_academy_ci
      JWT_SECRET: cvln-academy-ci-only-not-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and verified lint baseline
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "isort>=5.13.2,<6"
      - name: Black changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch; pre-existing formatting debt is not attributed to this delta."
          else
            black --check "${files[@]}"
          fi
      - name: Isort changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch; pre-existing import-order debt is not attributed to this delta."
          else
            isort --check-only --profile black --src-path backend "${files[@]}"
          fi
      - name: Flake8 changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch."
          else
            flake8 --config=backend/.flake8 "${files[@]}"
          fi
      - name: Mypy changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch; pre-existing mypy debt in backend/tests/test_fms_lineage.py is tracked separately."
          else
            mypy --ignore-missing-imports "${files[@]}"
          fi
      - name: Unit/integration tests without external HTTP E2E
        working-directory: backend
        run: pytest tests/ -n 0 --ignore=tests/backend_test.py
