name: Spatial Excel Line-by-Line CI

on:
  push:
    branches:
      - main
      - audit/spatial-excel-line-by-line-2026-09-11
  pull_request:

permissions:
  contents: read

concurrency:
  group: spatial-excel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: 137 Excel requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run one traceability test per requirement line
        run: node --test scripts/spatial-requirements.test.mjs

  frontend-unit-build:
    name: Frontend lint unit build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: ESLint
        run: npx eslint src e2e playwright.config.js
      - name: Unit tests
        run: CI=true yarn test --watchAll=false
      - name: Production build
        run: CI=true yarn build

  frontend-e2e:
    name: Frontend Playwright runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime E2E
        run: CI=true npx playwright test

  backend-regression:
    name: Backend lint types tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and verified lint baseline
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "isort>=5.13.2,<6"
      - name: Black full backend
        working-directory: backend
        run: black --check .
      - name: Isort changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch; pre-existing import-order debt is not attributed to this delta."
          else
            isort --check-only "${files[@]}"
          fi
      - name: Flake8 changed backend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.py' 'backend/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No backend Python files changed by Spatial branch; pre-existing Flake8 debt in backend/lx.py is tracked separately."
          else
            flake8 "${files[@]}"
          fi
      - name: Mypy full backend
        working-directory: backend
        run: mypy --ignore-missing-imports .
      - name: Unit/integration tests without external HTTP E2E
        working-directory: backend
        run: pytest tests/ -n 0 --ignore=tests/backend_test.py
