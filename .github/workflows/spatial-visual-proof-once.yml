name: Spatial Visual Proof Once

on:
  push:
    branches:
      - reconcile/spatial-cinematic-living-world-20260912

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Academy frontend
        run: |
          PORT=4173 BROWSER=none REACT_APP_BACKEND_URL=http://127.0.0.1:4174 yarn start > /tmp/cvln-spatial.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/cvln-spatial.log
          exit 1
      - name: Capture desktop and mobile runtime
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await desktop.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await desktop.waitForTimeout(2500);
            await desktop.screenshot({ path: 'spatial-proof-desktop.png', fullPage: true });
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });
            await mobile.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await mobile.waitForTimeout(2500);
            await mobile.screenshot({ path: 'spatial-proof-mobile.png', fullPage: true });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-visual-proof
          path: |
            frontend/spatial-proof-desktop.png
            frontend/spatial-proof-mobile.png
          if-no-files-found: error
