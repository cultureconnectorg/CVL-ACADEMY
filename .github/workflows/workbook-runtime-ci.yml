name: Workbook Runtime CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/cvln_academy_master/**"
      - ".github/workflows/workbook-runtime-ci.yml"
  workflow_dispatch:

jobs:
  workbook-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate workbook runtime reconciliation
        run: pytest -q tests/test_workbook_runtime_reconciliation.py
