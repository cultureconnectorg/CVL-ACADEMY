<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="960" y1="0" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04101E"/>
      <stop offset="0.26" stop-color="#0B2340"/>
      <stop offset="0.52" stop-color="#3B3145"/>
      <stop offset="0.72" stop-color="#D06A35"/>
      <stop offset="1" stop-color="#1B120F"/>
