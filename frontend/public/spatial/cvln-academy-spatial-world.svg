    <linearGradient id="sea" x1="960" y1="650" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173A4B"/>
      <stop offset="0.38" stop-color="#0E2837"/>
      <stop offset="1" stop-color="#041019"/>
    </linearGradient>
    <linearGradient id="campus" x1="1270" y1="500" x2="1735" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8D8C8" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#8C6B57" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2A2525" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 666) rotate(90) scale(270 360)">
      <stop stop-color="#FFB35F" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#FF7A22" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FF6A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1448 267) rotate(90) scale(178)">
      <stop stop-color="#2E84B8"/>
      <stop offset="0.46" stop-color="#124768"/>
      <stop offset="1" stop-color="#071C2D"/>
    </radialGradient>
    <filter id="soft32" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="soft18" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowLine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

